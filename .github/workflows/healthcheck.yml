name: healthcheck

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # daily 06:00 UTC drift check
    - cron: "0 6 * * *"

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps (viem for healthcheck)
        run: npm ci --prefix frontend
      - name: Run healthcheck (real RPC / contract / explorer / site calls)
        run: node frontend/scripts/healthcheck.mjs | tee healthcheck.txt
      - name: Append job summary
        if: always()
        run: |
          {
            echo "## IndexBasket healthcheck"
            echo '```'
            cat healthcheck.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
